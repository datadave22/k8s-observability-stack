apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: go-metrics-app-alerts
  namespace: monitoring
spec:
  groups:
    - name: go-metrics-app.rules
      rules:
        - alert: GoAppHighErrorRate
          # error_count is a separate counter from request_count (not a
          # status label on one counter, unlike the old Flask metrics) -
          # error rate is therefore error_count / request_count, not a
          # filtered fraction of a single series.
          expr: |
            (
              sum(rate(error_count[5m]))
              /
              sum(rate(request_count[5m]))
            ) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High HTTP error rate on go-metrics-app"
            description: >-
              More than 5% of requests to go-metrics-app have returned a
              5xx status over the last 5 minutes (current value:
              {{ $value | humanizePercentage }}).

        - alert: GoAppHighRequestLatency
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(request_duration_seconds_bucket[5m])) by (le)
            ) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High p95 request latency on go-metrics-app"
            description: >-
              The 95th percentile request latency for go-metrics-app has
              been above 1s for 5 minutes (current value:
              {{ $value | humanizeDuration }}).
