apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flask-metrics-app-alerts
  namespace: monitoring
spec:
  groups:
    - name: flask-metrics-app.rules
      rules:
        - alert: FlaskHighErrorRate
          expr: |
            (
              sum(rate(flask_http_request_total{http_status=~"5.."}[5m]))
              /
              sum(rate(flask_http_request_total[5m]))
            ) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High HTTP error rate on flask-metrics-app"
            description: >-
              More than 5% of requests to flask-metrics-app have returned a
              5xx status over the last 5 minutes (current value:
              {{ $value | humanizePercentage }}).

        - alert: FlaskHighRequestLatency
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le)
            ) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High p95 request latency on flask-metrics-app"
            description: >-
              The 95th percentile request latency for flask-metrics-app has
              been above 1s for 5 minutes (current value:
              {{ $value | humanizeDuration }}).
