apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-metrics-app
  namespace: go-metrics-app
  labels:
    app: go-metrics-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-metrics-app
  template:
    metadata:
      labels:
        app: go-metrics-app
    spec:
      # Matches the app's own SIGTERM handling (main.go: up to 10s to drain
      # in-flight requests) plus headroom for the kubelet/endpoint update.
      terminationGracePeriodSeconds: 15
      containers:
        - name: go-metrics-app
          image: go-metrics-app:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          # A static Go binary has a far smaller footprint than the CPython
          # + Flask + gunicorn stack it replaced - halved versus the
          # previous Python limits.
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
