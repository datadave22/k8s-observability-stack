name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: go-metrics-app:ci

jobs:
  lint:
    name: Lint (Helm values + Kubernetes manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Lint kube-prometheus-stack values
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm pull prometheus-community/kube-prometheus-stack --untar --untardir /tmp/charts
          helm lint /tmp/charts/kube-prometheus-stack -f prometheus/values.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint Kubernetes manifests
        run: yamllint -c .yamllint.yml k8s/ kind/ prometheus/alerts.yaml

  build:
    name: Build Go app image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE }} app/

  security:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t ${{ env.IMAGE }} app/

      # ignore-unfixed: don't fail on CVEs with no available fix yet -
      # nothing actionable to do about those today.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
